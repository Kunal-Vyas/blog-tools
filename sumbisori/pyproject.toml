[project]
name = "sumbisori"
version = "0.1.0"
description = "A local pre-push code reviewer built on Ollama"
requires-python = ">=3.11"
dependencies = ["ollama>=0.6", "pydantic>=2.7", "httpx>=0.27"]

[project.scripts]
sumbisori-pre-push = "sumbisori.hook:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sumbisori"]
