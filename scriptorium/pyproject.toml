[project]
name = "scriptorium"
version = "0.2.0"
description = "A small search engine built with Apache Spark, the way the OED was built"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.0",
    "pyarrow>=15",
    "pandas>=2.2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scriptorium", "scriptorium.demo"]
