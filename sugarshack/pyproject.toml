[project]
name = "sugarshack"
version = "0.1.0"
description = "A laptop-sized medallion lakehouse: bronze files, silver and gold with dbt and DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sugarshack = "sugarshack.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sugarshack"]

[tool.setuptools.package-data]
sugarshack = ["shack/*.yml", "shack/**/*.sql", "shack/**/*.yml"]
